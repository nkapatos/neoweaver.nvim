# buf.gen.yaml - Generate TypeScript types from mindweaver server protos
# These are then converted to Lua type annotations via scripts/ts-to-lua.ts
#
# Prerequisites:
#   - Server repo must be cloned as sibling: ../server/proto/mind
#   - Dependencies installed: bun install
#
# Usage: buf generate (from neoweaver root)
version: v2
clean: true
plugins:
  - local: node_modules/.bin/protoc-gen-es
    out: gen/ts
    opt: target=ts
inputs:
  - directory: ../server/proto/mind
